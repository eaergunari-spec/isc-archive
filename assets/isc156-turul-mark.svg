<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="t d">
<title id="t">ISC 156 Turul and rising sun mark</title>
<desc id="d">A modern symmetrical Turul bird opening its wings in front of a rising sun.</desc>
<defs>
  <radialGradient id="sun" cx="50%" cy="48%" r="55%">
    <stop offset="0" stop-color="#f4f0e7"/>
    <stop offset=".54" stop-color="#d84d60"/>
    <stop offset="1" stop-color="#d84d60" stop-opacity=".12"/>
  </radialGradient>
  <linearGradient id="wing" x1="0" x2="1">
    <stop offset="0" stop-color="#718fd8"/>
    <stop offset=".52" stop-color="#f4f0e7"/>
    <stop offset="1" stop-color="#c9f24a"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

