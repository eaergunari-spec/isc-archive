<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">ISC 156 geometric Turul mark</title>
  <desc id="desc">A symmetrical geometric line drawing of the Turul rising in front of a constructed sunrise.</desc>

  <defs>
    <linearGradient id="mainStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#718FD8"/>
      <stop offset=".34" stop-color="#F4F0E7"/>
      <stop offset=".66" stop-color="#F4F0E7"/>
      <stop offset="1" stop-color="#C9F24A"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D84D60"/>
      <stop offset=".55" stop-color="#F4F0E7"/>
      <stop offset="1" stop-color="#C9F24A"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- construction geometry -->
  <g fill="none" stroke="#F4F0E7" stroke-linecap="round">
    <circle cx="500" cy="338" r="154" stroke-opacity=".19" stroke-width="1"/>
    <circle cx="500" cy="338" r="205" stroke-opacity=".10" stroke-width="1"/>
    <circle cx="500" cy="338" r="258" stroke-opacity=".06" stroke-width="1"/>
    <path d="M500 78 V648" stroke-opacity=".12" stroke-width="1"/>
    <path d="M140 508 H860" stroke-opacity=".17" stroke-width="1"/>
    <path d="M185 338 H815" stroke-opacity=".055" stroke-width="1"/>
  </g>

  <!-- sunrise rays -->
  <g fill="none" stroke="#D84D60" stroke-width="1.2" stroke-opacity=".36" stroke-linecap="round">
    <path d="M500 183 V124"/>
    <path d="M454 190 L438 134"/>
    <path d="M546 190 L562 134"/>
    <path d="M411 208 L380 158"/>
    <path d="M589 208 L620 158"/>
    <path d="M373 237 L331 197"/>
    <path d="M627 237 L669 197"/>
    <path d="M347 276 L296 250"/>
    <path d="M653 276 L704 250"/>
  </g>

  <!-- sun core -->
  <circle cx="500" cy="338" r="118" fill="none" stroke="#D84D60" stroke-width="2.2" stroke-opacity=".9"/>
  <circle cx="500" cy="338" r="108" fill="none" stroke="#C9F24A" stroke-width="1" stroke-opacity=".24"/>

  <!-- primary wing silhouettes -->
  <g fill="none" stroke="url(#mainStroke)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M492 365 C424 338 365 292 310 234 C267 189 213 160 149 141 C210 213 260 266 321 311 C374 350 424 376 482 390" stroke-width="4.2"/>
    <path d="M482 393 C396 373 318 375 225 404 C183 417 145 433 111 454 C221 448 318 456 402 486 C438 499 466 513 489 532" stroke-width="3"/>
    <path d="M508 365 C576 338 635 292 690 234 C733 189 787 160 851 141 C790 213 740 266 679 311 C626 350 576 376 518 390" stroke-width="4.2"/>
    <path d="M518 393 C604 373 682 375 775 404 C817 417 855 433 889 454 C779 448 682 456 598 486 C562 499 534 513 511 532" stroke-width="3"/>
  </g>

  <!-- feather construction -->
  <g fill="none" stroke="#F4F0E7" stroke-opacity=".48" stroke-linecap="round">
    <path d="M446 350 C389 320 342 282 299 236" stroke-width="1.8"/>
    <path d="M413 363 C350 337 299 309 249 274" stroke-width="1.5"/>
    <path d="M377 375 C312 357 258 345 198 342" stroke-width="1.4"/>
    <path d="M340 392 C276 385 218 389 160 405" stroke-width="1.3"/>
    <path d="M554 350 C611 320 658 282 701 236" stroke-width="1.8"/>
    <path d="M587 363 C650 337 701 309 751 274" stroke-width="1.5"/>
    <path d="M623 375 C688 357 742 345 802 342" stroke-width="1.4"/>
    <path d="M660 392 C724 385 782 389 840 405" stroke-width="1.3"/>
  </g>

  <!-- secondary accent arcs -->
  <g fill="none" stroke="url(#accentStroke)" stroke-linecap="round">
    <path d="M474 420 C405 409 337 414 267 440" stroke-width="1.5" stroke-opacity=".7"/>
    <path d="M526 420 C595 409 663 414 733 440" stroke-width="1.5" stroke-opacity=".7"/>
    <path d="M456 335 C410 301 377 270 348 233" stroke-width="1.2" stroke-opacity=".55"/>
    <path d="M544 335 C590 301 623 270 652 233" stroke-width="1.2" stroke-opacity=".55"/>
  </g>

  <!-- central body -->
  <g fill="none" stroke="#F4F0E7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M500 274 C477 292 466 319 468 350 C470 388 482 423 500 459 C518 423 530 388 532 350 C534 319 523 292 500 274 Z" stroke-width="3"/>
    <path d="M500 274 C499 247 510 225 534 208 C530 231 536 249 553 262 C531 257 514 261 500 274 Z" stroke-width="2.5"/>
    <path d="M535 208 L574 216 L544 232" stroke="#C9F24A" stroke-width="2"/>
    <path d="M486 319 C493 314 501 312 510 313" stroke-width="1.4" stroke-opacity=".55"/>
    <circle cx="523" cy="239" r="2.6" fill="#C9F24A" stroke="none"/>
  </g>

  <!-- tail / vertical axis -->
  <g fill="none" stroke="url(#mainStroke)" stroke-linecap="round">
    <path d="M500 459 C485 501 470 544 454 598" stroke-width="2.5"/>
    <path d="M500 459 V616" stroke-width="3"/>
    <path d="M500 459 C515 501 530 544 546 598" stroke-width="2.5"/>
    <path d="M500 500 C479 532 463 561 450 590" stroke-width="1.2" stroke-opacity=".5"/>
    <path d="M500 500 C521 532 537 561 550 590" stroke-width="1.2" stroke-opacity=".5"/>
  </g>

  <!-- horizon -->
  <path d="M130 508 H870" stroke="#F4F0E7" stroke-width="1.3" stroke-opacity=".55"/>
  <path d="M250 519 H750" stroke="#C9F24A" stroke-width="1" stroke-opacity=".33"/>

  <!-- tiny registration marks -->
  <g stroke="#F4F0E7" stroke-width="1" stroke-opacity=".28">
    <path d="M128 498 V518 M118 508 H138"/>
    <path d="M872 498 V518 M862 508 H882"/>
    <path d="M490 648 H510"/>
  </g>
</svg>