name: Recover stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-recovery.yml"

permissions:
  contents: read
  actions: write
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale workflow retries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          cancel_run() {
            local run_id="$1"
            local code
            code=$(curl -sS -o /tmp/cancel-run.json -w "%{http_code}"               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel")
            echo "cancel workflow $run_id -> HTTP $code"
            if [[ "$code" != "202" && "$code" != "409" ]]; then
              cat /tmp/cancel-run.json || true
              exit 1
            fi
          }
          cancel_run "38770169152"
          cancel_run "38772461525"

      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_DEPLOYMENT: "9334e422e902181317d14970a31fa68172448e6a"
        shell: bash
        run: |
          set -u
          code=$(curl -sS -o /tmp/cancel-pages.json -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/pages/deployments/$STALE_DEPLOYMENT/cancel")
          echo "cancel Pages deployment $STALE_DEPLOYMENT -> HTTP $code"
          if [[ "$code" != "204" && "$code" != "404" ]]; then
            cat /tmp/cancel-pages.json || true
            exit 1
          fi
