name: Recover stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-recovery.yml"

permissions:
  contents: read
  actions: write
  deployments: write
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel stale workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38770169152 38772461525; do
            code=$(curl -sS -o /tmp/force-cancel.json -w "%{http_code}" -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/actions/runs/$run_id/force-cancel")
            echo "force-cancel workflow $run_id -> HTTP $code"
            if [[ "$code" != "202" && "$code" != "409" ]]; then
              cat /tmp/force-cancel.json || true
              exit 1
            fi
          done

      - name: Remove stale github-pages environment deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_SHA: "9334e422e902181317d14970a31fa68172448e6a"
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -o /tmp/deployments.json             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=100"

          python3 -c 'import json; d=json.load(open("/tmp/deployments.json")); print("github-pages deployments:", [(x.get("id"),x.get("sha"),x.get("environment")) for x in d])'

          mapfile -t DEPLOYMENT_IDS < <(python3 -c 'import json,os; d=json.load(open("/tmp/deployments.json")); s=os.environ["STALE_SHA"]; [print(x["id"]) for x in d if x.get("sha")==s]')

          if (( ${#DEPLOYMENT_IDS[@]} == 0 )); then
            echo "No generic github-pages deployment found for stale SHA"
          fi

          for deployment_id in "${DEPLOYMENT_IDS[@]}"; do
            code=$(curl -sS -o /tmp/inactive.json -w "%{http_code}"               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/json"               -d '{"state":"inactive","description":"Clear stale GitHub Pages deployment lock"}'               "https://api.github.com/repos/$REPO/deployments/$deployment_id/statuses")
            echo "mark deployment $deployment_id inactive -> HTTP $code"
            if [[ "$code" != "201" ]]; then
              cat /tmp/inactive.json || true
              exit 1
            fi

            sleep 1

            code=$(curl -sS -o /tmp/delete-deployment.json -w "%{http_code}"               -X DELETE               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/deployments/$deployment_id")
            echo "delete deployment $deployment_id -> HTTP $code"
            if [[ "$code" != "204" && "$code" != "404" ]]; then
              cat /tmp/delete-deployment.json || true
              exit 1
            fi
          done

      - name: Cancel and wait for stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_DEPLOYMENT: "9334e422e902181317d14970a31fa68172448e6a"
        shell: bash
        run: |
          set -euo pipefail

          cancel_stale() {
            local code
            code=$(curl -sS -o /tmp/cancel-pages.json -w "%{http_code}" -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/pages/deployments/$STALE_DEPLOYMENT/cancel")
            echo "cancel stale Pages deployment -> HTTP $code"
            if [[ "$code" != "204" && "$code" != "404" ]]; then
              cat /tmp/cancel-pages.json || true
              return 1
            fi
          }

          cancel_stale

          cleared="false"
          for attempt in $(seq 1 48); do
            code=$(curl -sS -o /tmp/pages-status.json -w "%{http_code}" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/pages/deployments/$STALE_DEPLOYMENT")

            if [[ "$code" == "404" ]]; then
              echo "stale deployment no longer exists (attempt $attempt)"
              cleared="true"
              break
            fi

            if [[ "$code" != "200" ]]; then
              echo "unexpected status endpoint HTTP $code"
              cat /tmp/pages-status.json || true
              exit 1
            fi

            status=$(python3 -c 'import json; print(json.load(open("/tmp/pages-status.json", encoding="utf-8")).get("status", ""))')
            echo "stale deployment status (attempt $attempt): $status"

            case "$status" in
              deployment_cancelled|canceled|cancelled|succeed|success|failed|error)
                cleared="true"
                break
                ;;
              *)
                if (( attempt % 6 == 0 )); then
                  cancel_stale || true
                fi
                sleep 5
                ;;
            esac
          done

          if [[ "$cleared" != "true" ]]; then
            echo "stale Pages deployment did not clear within recovery window"
            exit 1
          fi

      - name: Request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/request-build.json -w "%{http_code}" -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPO/pages/builds")
          echo "request fresh Pages build -> HTTP $code"
          cat /tmp/request-build.json || true
          [[ "$code" == "201" ]]
