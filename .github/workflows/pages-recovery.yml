name: Recover stuck Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-recovery.yml"

permissions:
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel and wait for stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_DEPLOYMENT: "9334e422e902181317d14970a31fa68172448e6a"
        shell: bash
        run: |
          set -euo pipefail

          cancel_stale() {
            local code
            code=$(curl -sS -o /tmp/cancel-pages.json -w "%{http_code}"               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/pages/deployments/$STALE_DEPLOYMENT/cancel")
            echo "cancel stale Pages deployment -> HTTP $code"
            if [[ "$code" != "204" && "$code" != "404" ]]; then
              cat /tmp/cancel-pages.json || true
              return 1
            fi
          }

          cancel_stale

          cleared="false"
          for attempt in $(seq 1 48); do
            code=$(curl -sS -o /tmp/pages-status.json -w "%{http_code}"               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPO/pages/deployments/$STALE_DEPLOYMENT")

            if [[ "$code" == "404" ]]; then
              echo "stale deployment no longer exists (attempt $attempt)"
              cleared="true"
              break
            fi

            if [[ "$code" != "200" ]]; then
              echo "unexpected status endpoint HTTP $code"
              cat /tmp/pages-status.json || true
              exit 1
            fi

            status=$(python3 - <<'PY'
import json
with open('/tmp/pages-status.json', 'r', encoding='utf-8') as f:
    print(json.load(f).get('status', ''))
PY
)
            echo "stale deployment status (attempt $attempt): $status"

            case "$status" in
              canceled|cancelled|succeed|success|failed|error)
                cleared="true"
                break
                ;;
              *)
                if (( attempt % 6 == 0 )); then
                  cancel_stale || true
                fi
                sleep 5
                ;;
            esac
          done

          if [[ "$cleared" != "true" ]]; then
            echo "stale Pages deployment did not clear within recovery window"
            exit 1
          fi

      - name: Request fresh Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/request-build.json -w "%{http_code}"             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPO/pages/builds")
          echo "request fresh Pages build -> HTTP $code"
          cat /tmp/request-build.json || true
          [[ "$code" == "201" ]]
